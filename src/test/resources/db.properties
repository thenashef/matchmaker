# Overrides src/main/resources/db.properties for `mvn test` only -- Maven puts the test
# classpath (target/test-classes) ahead of the main one (target/classes), so DataSourceFactory's
# plain classpath lookup (getResourceAsStream("db.properties")) picks this file up automatically
# whenever tests run, with zero code involved.
#
# Points at a completely separate database (matchmaker_test, see db/schema.sql) so the
# DB-integration tests -- which clear whole tables in @BeforeEach for their own isolation -- can
# never wipe out manually-created dev/demo data sitting in the real `matchmaker` database.
db.url=jdbc:mysql://localhost:3306/matchmaker_test?connectionTimeZone=SERVER
db.username=matchmaker
db.password=matchmaker
